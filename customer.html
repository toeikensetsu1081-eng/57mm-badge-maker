<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>缶バッジ写真受付</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#222}
header{background:#123b63;color:#fff;padding:20px}.wrap{max-width:520px;margin:auto;padding:14px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 12px #0001}
.pick,button{display:block;width:100%;border:0;border-radius:14px;padding:17px;text-align:center;font-size:18px;font-weight:800}
.pick{background:#1261a0;color:#fff}button{background:#16834b;color:#fff;margin-top:12px}input{display:none}
#preview{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:12px;margin:14px 0}
.note{font-size:13px;color:#667;line-height:1.65}.ok{padding:16px;background:#eaf8f0;color:#11683d;border-radius:12px;font-weight:800}
</style></head><body>
<header><h1 style="margin:0;font-size:24px">缶バッジ写真受付</h1></header>
<div class="wrap"><div class="card">
<h2>写真を1枚選んでください</h2>
<p>スマホに保存されている、お好きな写真を缶バッジにできます。</p>
<label class="pick" for="photo">🖼️ 写真を選ぶ</label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif">
<img id="preview" hidden>
<button id="send" hidden>この写真を送信する</button>
<div id="message" style="margin-top:14px"></div>
<p class="note">写真は缶バッジ作成のためだけに一時保存します。送信から2時間後、またはスタッフが削除した時点でサーバーから削除されます。</p>
</div></div>
<script>
const session=new URLSearchParams(location.search).get('s');
const f=document.getElementById('photo'), p=document.getElementById('preview'), b=document.getElementById('send'), m=document.getElementById('message');
let selected=null;
if(!session){m.textContent='受付QRが無効です。スタッフにお声がけください。';}
f.onchange=()=>{selected=f.files&&f.files[0];if(!selected)return;p.src=URL.createObjectURL(selected);p.hidden=false;b.hidden=false;m.textContent='';};
b.onclick=async()=>{
 if(!selected||!session)return;b.disabled=true;b.textContent='送信中…';
 const fd=new FormData();fd.append('photo',selected);fd.append('session',session);
 try{
   const r=await fetch('/api/upload',{method:'POST',body:fd});
   const j=await r.json().catch(()=>({}));
   if(!r.ok)throw new Error(j.error||'送信失敗');
   m.className='ok';m.textContent='✓ 送信しました。スタッフにお声がけください。';
   b.hidden=true;f.disabled=true;
 }catch(e){m.className='';m.textContent='送信できませんでした。もう一度お試しください。';b.disabled=false;b.textContent='この写真を送信する';}
};
</script></body></html>
